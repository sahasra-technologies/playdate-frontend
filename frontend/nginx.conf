server {
    listen 80;
    server_name playdatesport.com www.playdatesport.com api.playdatesport.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name playdatesport.com www.playdatesport.com api.playdatesport.com;

    ssl_certificate /etc/letsencrypt/live/playdatesport.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playdatesport.com/privkey.pem;

    # 🚨 Add this line to increase allowed POST size
    client_max_body_size 50M;  # or whatever limit you need

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 🧠 WebSocket proxying: /api/ws/ -> ASGI server (Daphne/Uvicorn)
    location /ws/ {
        proxy_pass http://backend:8000;  # make sure this is your ASGI server
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Standard Django HTTP API

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
